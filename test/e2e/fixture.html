<body>

    window.__events = [];
    for (const name of ['loom21:open', 'loom21:checkout-created', 'loom21:paid', 'loom21:expired', 'loom21:closed'])
      document.addEventListener(name, e => window.__events.push({ name, detail: e.detail }));
