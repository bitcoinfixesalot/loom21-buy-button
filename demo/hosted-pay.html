<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock pay page</title>
  <style>body { font: 16px/1.5 system-ui, sans-serif; max-width: 420px; margin: 48px auto; padding: 0 16px; } button { font: inherit; padding: 10px 20px; }</style>
</head>
<body>
  <h1>Mock pay page</h1>
  <p>In production this is loom21's hosted pay page (card via Stripe, or the processor's own page).</p>
  <button id="pay">Pay (simulated)</button>
  <p id="done" hidden>Paid. Go back to the shop's tab: it has updated.</p>
  <script>
    document.getElementById('pay').addEventListener('click', async () => {
      await fetch('/mock-api/pay', { method: 'POST' });
      document.getElementById('done').hidden = false;
    });
  </script>
</body>
</html>
