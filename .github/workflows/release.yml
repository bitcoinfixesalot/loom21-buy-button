name: Release

# Push a tag like v1.0.0 (matching package.json's version): tests, publishes @loom21/buy-button to npm, and attaches
# dist/ and the script's SRI hash to a GitHub release. Needs the NPM_TOKEN secret (an npm automation token).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: SRI hash
        run: echo "sha384-$(openssl dgst -sha384 -binary dist/buy-button.js | openssl base64 -A)" > dist/buy-button.js.sri
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: |
          (cd dist && zip -r ../buy-button-dist.zip .)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/buy-button.js dist/buy-button.js.map dist/buy-button.js.sri buy-button-dist.zip
        env:
          GH_TOKEN: ${{ github.token }}
